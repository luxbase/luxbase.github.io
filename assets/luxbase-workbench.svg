    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect width="1800" height="1100" fill="url(#grid)"/>
  <path d="M0 780c214-93 391-92 529 2s286 127 444 98 299-95 424-58 259 82 403 14v264H0z" fill="#e4b04d" opacity=".2"/>
